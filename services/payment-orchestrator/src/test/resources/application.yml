spring:
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  autoconfigure:
    exclude: org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
management:
  endpoints:
    web:
      exposure:
        include: health,info
payhub:
  finledger:
    base-url: http://127.0.0.1:9
  clients:
    risk-service: http://127.0.0.1:9
    rail-adapter-service: http://127.0.0.1:9
    merchant-service: http://127.0.0.1:9
  temporal:
    enabled: false
  risk:
    mode: in-memory
