spring:
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  autoconfigure:
    exclude: org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
management:
  endpoints:
    web:
      exposure:
        include: health,info
payhub:
  finledger:
    base-url: http://localhost:8080
    aggregator-tenant-id: 00000000-0000-0000-0000-0000000000a1
    default-currency: USD
