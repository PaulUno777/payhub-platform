spring:
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
payhub:
  security:
    issuer-uri: http://localhost:8090
  clients:
    merchant-service: http://localhost:8300
    payment-orchestrator: http://localhost:8310
    reconciliation-service: http://localhost:8400
