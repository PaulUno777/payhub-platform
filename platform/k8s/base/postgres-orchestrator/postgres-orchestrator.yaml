apiVersion: v1
kind: Service
metadata:
  name: postgres-orchestrator
  labels:
    app.kubernetes.io/name: postgres-orchestrator
spec:
  selector:
    app.kubernetes.io/name: postgres-orchestrator
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-orchestrator
  labels:
    app.kubernetes.io/name: postgres-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-orchestrator
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: orchestrator
            - name: POSTGRES_USER
              value: payhub
            - name: POSTGRES_PASSWORD
              value: payhub
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "payhub", "-d", "orchestrator"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 512Mi
