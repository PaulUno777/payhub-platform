apiVersion: v1
kind: Service
metadata:
  name: postgres-temporal
  labels:
    app.kubernetes.io/name: postgres-temporal
spec:
  selector:
    app.kubernetes.io/name: postgres-temporal
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-temporal
  labels:
    app.kubernetes.io/name: postgres-temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-temporal
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: temporal
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PASSWORD
              value: temporal
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal", "-d", "temporal"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
