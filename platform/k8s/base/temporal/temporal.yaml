apiVersion: v1
kind: Service
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
      nodePort: 30233
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      # auto-setup must see a ready Postgres or schema setup is skipped / empty.
      initContainers:
        - name: wait-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-temporal -U temporal -d temporal; do
                echo "waiting for postgres-temporal..."
                sleep 2
              done
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.25.2
          imagePullPolicy: IfNotPresent
          # Image entrypoint only runs /etc/temporal/auto-setup.sh when this arg is present
          # (Compose inherits the image CMD; bare K8s Deployment does not).
          args: ["autosetup"]
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: DBNAME
              value: temporal
            - name: VISIBILITY_DBNAME
              value: temporal_visibility
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              value: temporal
            - name: POSTGRES_SEEDS
              value: postgres-temporal
          ports:
            - containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
