apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/pauluno777/payhub-payment-orchestrator
    newTag: "0.1.0"
patches:
  - target:
      kind: Deployment
      name: payment-orchestrator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
