# PayHub apps — GHCR :0.2.0, SerialGC, compose DNS. ClusterIP only (runbook uses port-forward).
apiVersion: v1
kind: Secret
metadata:
  name: payhub-db
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: payhub
  SPRING_DATASOURCE_USERNAME: payhub
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payhub-app-common
data:
  SPRING_CLOUD_CONFIG_ENABLED: "false"
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
  JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:MaxRAMPercentage=75.0"
  PAYHUB_OIDC_ISSUER: http://zitadel:8080
  PAYHUB_SECURITY_ISSUER_URI: http://zitadel:8080
  TRACING_OTLP_ENABLED: "false"
  FINLEDGER_BASE_URL: http://finledger:8080
  PAYHUB_FINLEDGER_BASE_URL: http://finledger:8080
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-service
  labels: {app.kubernetes.io/name: merchant-service}
spec:
  selector: {app.kubernetes.io/name: merchant-service}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
    - {name: management, port: 8081, targetPort: 8081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-service
  labels: {app.kubernetes.io/name: merchant-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: merchant-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: merchant-service}
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres-merchant -U payhub -d merchant; do sleep 2; done"]
      containers:
        - name: app
          image: ghcr.io/pauluno777/payhub-merchant-service:0.2.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: payhub-app-common}
            - secretRef: {name: payhub-db}
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-merchant:5432/merchant
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /actuator/health, port: management}
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 400m, memory: 384Mi}
---
