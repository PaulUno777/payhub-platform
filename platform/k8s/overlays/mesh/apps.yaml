apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  labels: {app.kubernetes.io/name: reporting-service}
spec:
  selector: {app.kubernetes.io/name: reporting-service}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
    - {name: management, port: 8081, targetPort: 8081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  labels: {app.kubernetes.io/name: reporting-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: reporting-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: reporting-service}
    spec:
      initContainers:
        - name: wait-deps
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-reporting -U payhub -d reporting; do sleep 2; done
      containers:
        - name: app
          image: ghcr.io/pauluno777/payhub-reporting-service:0.2.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: payhub-app-common}
            - secretRef: {name: payhub-db}
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-reporting:5432/reporting
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: PAYHUB_KAFKA_ENABLED
              value: "true"
            - name: PAYHUB_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /actuator/health, port: management}
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 400m, memory: 384Mi}
