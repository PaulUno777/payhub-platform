# Tuned Postgres-per-service (DS-020). postgres-orchestrator / postgres-temporal stay
# in base; mesh overlay patches their command. postgres-finledger has a PVC (CDC source).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-finledger-data
  labels:
    app.kubernetes.io/name: postgres-finledger
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-finledger-init
  labels:
    app.kubernetes.io/name: postgres-finledger
data:
  01-app-role.sql: |
    DO $$ BEGIN
      CREATE ROLE finledger_app LOGIN PASSWORD 'finledger';
    EXCEPTION WHEN duplicate_object THEN NULL;
    END $$;
    GRANT ALL PRIVILEGES ON DATABASE finledger TO finledger_app;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-finledger
  labels:
    app.kubernetes.io/name: postgres-finledger
spec:
  selector:
    app.kubernetes.io/name: postgres-finledger
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-finledger
  labels:
    app.kubernetes.io/name: postgres-finledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-finledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-finledger
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - wal_level=logical
            - -c
            - max_connections=20
            - -c
            - shared_buffers=32MB
            - -c
            - work_mem=4MB
          env:
            - name: POSTGRES_DB
              value: finledger
            - name: POSTGRES_USER
              value: finledger
            - name: POSTGRES_PASSWORD
              value: finledger
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "finledger", "-d", "finledger"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 192Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-finledger-data
        - name: init
          configMap:
            name: postgres-finledger-init
---
