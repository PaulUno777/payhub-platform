# DS-002: Postgres per DB-backed service. Kafka / Temporal / Redis / Rabbit come later.
name: payhub

services:
  postgres-merchant:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: merchant
      POSTGRES_USER: payhub
      POSTGRES_PASSWORD: payhub
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payhub -d merchant"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-orchestrator:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orchestrator
