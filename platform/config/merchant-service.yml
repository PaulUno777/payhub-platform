    base-url: ${FINLEDGER_BASE_URL:http://localhost:8080}
    aggregator-tenant-id: ${FINLEDGER_AGGREGATOR_TENANT_ID:00000000-0000-0000-0000-0000000000a1}
    default-currency: USD
