spring:
  datasource:
    url: jdbc:postgresql://postgres-reporting:5432/reporting
    username: ${DB_USERNAME:payhub}
    password: ${DB_PASSWORD:payhub}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
payhub:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
