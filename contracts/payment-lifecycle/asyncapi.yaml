asyncapi: 2.6.0
info:
  title: PayHub payment.lifecycle.v1
  version: 0.1.0
  description: |
    Payment status lifecycle events published by payment-orchestrator via transactional
    outbox + poller (DS-007). Payload is PII-free.
channels:
  payment.lifecycle.v1:
    description: Payment status changed
    publish:
      operationId: publishPaymentLifecycle
      message:
        $ref: '#/components/messages/PaymentLifecycleEnvelope'
    subscribe:
      operationId: consumePaymentLifecycle
      message:
        $ref: '#/components/messages/PaymentLifecycleEnvelope'
components:
  messages:
    PaymentLifecycleEnvelope:
      name: PaymentLifecycleEnvelope
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PaymentLifecycleEnvelope'
  schemas:
    PaymentLifecycleEnvelope:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - producer
        - aggregateId
        - tenantId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum: [PaymentStatusChanged]
        schemaVersion:
          type: string
          example: "1"
        occurredAt:
          type: string
          format: date-time
        producer:
          type: string
          example: payment-orchestrator
        aggregateId:
          type: string
          format: uuid
          description: paymentId
        tenantId:
          type: string
          format: uuid
        traceparent:
          type: string
          nullable: true
        causationId:
          type: string
          nullable: true
        payload:
          $ref: '#/components/schemas/PaymentStatusChanged'
    PaymentStatusChanged:
      type: object
      required: [paymentId, merchantId, tenantId, status]
      properties:
        paymentId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        status:
          type: string
          description: PaymentStatus name (e.g. RISK_APPROVED)
