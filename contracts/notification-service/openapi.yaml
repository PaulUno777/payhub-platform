openapi: 3.0.3
info:
  title: notification-service
  version: 0.0.1
  description: Merchant webhook delivery (HMAC-signed HTTP), retries, and observable DLQ (DS-014).
paths:
  /actuator/health:
    get:
      summary: Health probe
      operationId: health
      responses:
        '200':
          description: OK
  /api/v1/webhooks/dlq:
    get:
      summary: List dead-letter webhook deliveries for a tenant
      operationId: listWebhookDlq
      parameters:
        - name: X-PayHub-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Dead deliveries (status DEAD)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookDeliveryView'
  /api/v1/webhooks/deliveries/{deliveryId}:
    get:
      summary: Get a webhook delivery by id
      operationId: getWebhookDelivery
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-PayHub-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delivery found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryView'
        '404':
          description: Not found
components:
  schemas:
    WebhookDeliveryView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        paymentStatus:
          type: string
        occurredAt:
          type: string
          format: date-time
        endpointUrl:
          type: string
        status:
          type: string
          enum: [PENDING, IN_FLIGHT, DELIVERED, FAILED_RETRYABLE, DEAD]
        attemptCount:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
